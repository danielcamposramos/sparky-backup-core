###Sparky Backup Core Stereo: the Sparky Stereo OS profile###
# Read by sparkybackup-stereo after sparkybackup.conf; what is set here wins.


# The label of the live system, its ISO file and volume id
LIVECDLABEL="Sparky Stereo OS"
ISOLABELFULL="Sparky Stereo OS 9 Mashtabba"
CUSTOMISO="sparky-stereo-os-9-mashtabba-x86_64.iso"
VOLID64BIT="SPARKY_STEREO_9"


# The profile's boot menus and disk info: the stereo kernel first, Debian's signed kernel as the
# Secure Boot fallback (LIVEKERNEL2), and MokManager to enrol the edition's key
BOOTMENUS="/usr/lib/sparkybackup/stereo"
MOKCERT="/usr/lib/sparkybackup/stereo/secureboot/sparky-stereo-secureboot-2026.der"


# The stereo kernel (LIVEKERNEL, empty: the running one) and Debian's signed kernel (LIVEKERNEL2)
LIVEKERNEL=""
LIVEKERNEL2=""
