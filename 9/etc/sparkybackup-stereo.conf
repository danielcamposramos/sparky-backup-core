###Sparky Backup Core Stereo: the Sparky Stereo OS profile###
# Read by sparkybackup-stereo after sparkybackup.conf; what is set here wins.


# The label of the live system, its ISO file and volume id
LIVECDLABEL="Sparky Stereo OS"
ISOLABELFULL="Sparky Stereo OS 9 Mashtabba"
CUSTOMISO="sparky-stereo-os-9-mashtabba-x86_64.iso"
VOLID64BIT="SPARKY_STEREO_9"


# The profile's boot pictures, menu generator (gen-menus.py) and texts, and the certificate MokManager enrolls from
# the EFI image. The menus are written at every run from what the image holds: its kernels, the enrolment when
# MokManager and the certificate are on the EFI image, the languages of the base menus.
BOOTMENUS="${SPARKY_BOOTMENUS:-/usr/lib/sparkybackup/stereo}"
MOKCERT="${SPARKY_MOKCERT:-/usr/lib/sparkybackup/stereo/secureboot/sparky-stereo-secureboot-2026.der}"


# The default live kernel (empty: the running one); every further kernel in /boot goes on the medium too, each with
# its menu entry. The locales that get an entry on the menus' first page as well (LIVELANGUAGES).
LIVEKERNEL="${SPARKY_LIVEKERNEL:-}"
LIVEKERNEL2=""
LIVELANGUAGES="${SPARKY_LIVELANGUAGES:-de_DE}"


# Lean Code is required by the Sparky Stereo OS ISO profile: sparkybackup-leancode measures the image's
# coverage and the ISO is labelled compliant only when every comment-bearing file is covered
LEANCODE="yes"

# A program run on the folders about to be squashed, with those folders as its arguments, before the Lean
# Code stage (the pipeline's Lean Code projection). Empty: none. The environment's value wins, so a build
# can turn it on and off without editing this file.
PRESQUASHFS_HOOK="${PRESQUASHFS_HOOK:-}"
