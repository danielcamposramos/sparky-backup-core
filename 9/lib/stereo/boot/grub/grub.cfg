source /boot/grub/config.cfg

# Live boot. Under Secure Boot the stereo kernel starts once the Sparky Stereo OS key is enrolled;
# until then each entry starts Debian's signed kernel instead (live/vmlinuz2).

menuentry "Sparky Stereo OS (live)" {
    if linux /live/vmlinuz boot=live components quiet splash findiso=${iso_path}; then
        initrd /live/initrd.img
    else
        echo "The Sparky Stereo OS key is not enrolled: starting Debian's signed kernel instead."
        linux /live/vmlinuz2 boot=live components quiet splash findiso=${iso_path}
        initrd /live/initrd2.img
    fi
}

menuentry "Sparky Stereo OS (live, Deutsch)" {
    if linux /live/vmlinuz boot=live components locales=de_DE.UTF-8 keyboard-layouts=de quiet splash findiso=${iso_path}; then
        initrd /live/initrd.img
    else
        echo "The Sparky Stereo OS key is not enrolled: starting Debian's signed kernel instead."
        linux /live/vmlinuz2 boot=live components locales=de_DE.UTF-8 keyboard-layouts=de quiet splash findiso=${iso_path}
        initrd /live/initrd2.img
    fi
}

menuentry "Sparky Stereo OS with Debian's signed kernel (no key needed, no stereo kernel)" {
    linux   /live/vmlinuz2 boot=live components quiet splash findiso=${iso_path}
    initrd  /live/initrd2.img
}

if [ "$grub_platform" = efi ]; then
    menuentry "Enrol the Sparky Stereo OS key (MokManager, Secure Boot)" {
        chainloader /EFI/boot/mmx64.efi
    }
fi

menuentry "Safe graphics (nomodeset)" {
    if linux /live/vmlinuz boot=live components nomodeset nosplash findiso=${iso_path}; then
        initrd /live/initrd.img
    else
        echo "The Sparky Stereo OS key is not enrolled: starting Debian's signed kernel instead."
        linux /live/vmlinuz2 boot=live components nomodeset nosplash findiso=${iso_path}
        initrd /live/initrd2.img
    fi
}

menuentry "NoSplash" {
    if linux /live/vmlinuz boot=live components nosplash findiso=${iso_path}; then
