}

menuentry "Failsafe mode" {
    if linux /live/vmlinuz boot=live components memtest noapic noapm nodma nomce nolapic nosmp nosplash vga=788 findiso=${iso_path}; then
        initrd /live/initrd.img
    else
        echo "The Sparky Stereo OS key is not enrolled: starting Debian's signed kernel instead."
        linux /live/vmlinuz2 boot=live components memtest noapic noapm nodma nomce nolapic nosmp nosplash vga=788 findiso=${iso_path}
        initrd /live/initrd2.img
    fi
}

menuentry "Copy ToRAM" {
    if linux /live/vmlinuz boot=live components toram quiet splash findiso=${iso_path}; then
        initrd /live/initrd.img
    else
        echo "The Sparky Stereo OS key is not enrolled: starting Debian's signed kernel instead."
        linux /live/vmlinuz2 boot=live components toram quiet splash findiso=${iso_path}
        initrd /live/initrd2.img
    fi
}

menuentry "Text mode" {
    if linux /live/vmlinuz boot=live components quiet nosplash systemd.unit=multi-user.target findiso=${iso_path}; then
        initrd /live/initrd.img
    else
        echo "The Sparky Stereo OS key is not enrolled: starting Debian's signed kernel instead."
        linux /live/vmlinuz2 boot=live components quiet nosplash systemd.unit=multi-user.target findiso=${iso_path}
        initrd /live/initrd2.img
    fi
}

menuentry "Memory Test x64.efi" {
    linux   /boot/memtest86+x64.efi
}

menuentry "uEFI firmware setup" {
    fwsetup
}

