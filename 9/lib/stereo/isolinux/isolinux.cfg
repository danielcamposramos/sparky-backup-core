default /isolinux/vesamenu.c32
prompt 0
timeout 100
menu width 78
menu margin 4
menu rows 13
menu vshift 8
menu background /isolinux/background.png
menu title __LIVECDLABEL__ (BIOS mode)
menu tabmsg Press ENTER to boot, TAB to edit a menu entry or ESC to back
menu color border 0 #ffffffff #ee000000 std
menu color title 0 #ffffffff #ee000000 std
menu color sel 0 #ffffffff #20bfbfbf std
menu color unsel 0 #50ffffff #a0000000 std
menu color pwdheader 0 #ff000000 #99ffffff rev
menu color pwdborder 0 #ff000000 #99ffffff rev
menu color pwdentry 0 #ff000000 #99ffffff rev
menu color hotkey 0 #ff00ff00 #ee000000 std
menu color hotsel 0 #ffffffff #85000000 std


label live
	menu label __LIVELABEL__ (live)
	kernel /live/vmlinuz
	append initrd=/live/initrd.img boot=live config quiet splash

label livede
	menu label __LIVELABEL__ (live, Deutsch)
	kernel /live/vmlinuz
	append initrd=/live/initrd.img boot=live config locales=de_DE.UTF-8 keyboard-layouts=de quiet splash

label livedebian
	menu label __LIVELABEL__ with Debian's kernel
	kernel /live/vmlinuz2
	append initrd=/live/initrd2.img boot=live config quiet splash

label livenosplash
	menu label NoSplash
	kernel /live/vmlinuz
	append initrd=/live/initrd.img boot=live config quiet nosplash

label livefailsafe
	menu label Failsafe
	kernel /live/vmlinuz
	append initrd=/live/initrd.img boot=live config noapic noapm nodma nomce nolapic pci=nomsi nomodeset radeon.modeset=0 nouveau.modeset=0 nosmp vga=normal nosplash

label livetoram
	menu label Copy ToRAM
	kernel /live/vmlinuz
	append initrd=/live/initrd.img boot=live config toram nosplash

label livetext
	menu label Text mode
	kernel /live/vmlinuz
	append initrd=/live/initrd.img boot=live config systemd.unit=multi-user.target nosplash

label hd
	menu label Boot the first hard disk
	COM32 chain.c32
	APPEND hd0

